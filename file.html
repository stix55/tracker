<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cholesterol & Health Tracker</title>
  <script src="[cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js)"></script>
  <style>
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-emerald-500"></span>
          Lipid & Health Panel Tracker
        </h1>
        <p class="text-xs text-slate-500">Track and compare multi-user metrics across years</p>
      </div>

      <div class="flex items-center gap-2">
        <!-- Unit Toggle -->
        <div class="inline-flex rounded-lg border border-slate-200 bg-slate-100 p-1 text-xs font-semibold">
          <button id="btn-mgdl" onclick="setUnit('mgdl')" class="px-3 py-1 rounded bg-white shadow text-slate-800">mg/dL</button>
          <button id="btn-mmol" onclick="setUnit('mmol')" class="px-3 py-1 rounded text-slate-500 hover:text-slate-900">mmol/L</button>
        </div>

        <button onclick="addNewYearPrompt()" class="text-xs px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 font-medium text-slate-700">
          + Add Year
        </button>
        <button onclick="openMetricModal()" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 font-medium text-white shadow-sm">
          + Add Parameter
        </button>
        <button onclick="exportData()" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:text-slate-900" title="Export Backup">
          Export
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

    <!-- Comparison & Analytics Section -->
    <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
        <div>
          <h2 class="text-base font-bold text-slate-900">Cross-User Comparison</h2>
          <p class="text-xs text-slate-500">Compare parameter trends across all 4 users simultaneously</p>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs font-medium text-slate-600">Select Parameter:</label>
          <select id="chart-metric-select" onchange="renderChart()" class="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
        </div>
      </div>
      <div class="h-72 w-full">
        <canvas id="trendChart"></canvas>
      </div>
    </section>

    <!-- User Tabs & Editable Tables -->
    <section class="space-y-4">
      <div class="flex items-center justify-between border-b border-slate-200 pb-2">
        <div class="flex space-x-2" id="user-tab-buttons"></div>
        <span class="text-xs text-slate-400 italic">Values automatically save upon editing cells</span>
      </div>

      <!-- Active User Table Card -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead class="bg-slate-50 text-slate-600 border-b border-slate-200 uppercase tracking-wider text-[11px]">
              <tr id="table-head-row">
                <!-- Dynamically Populated Headers -->
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-100 font-mono text-slate-700">
              <!-- Dynamically Populated Rows -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal for Adding New Metric -->
  <div id="metric-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-bold text-slate-900">Add New Health Parameter</h3>
        <button onclick="closeMetricModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Parameter Name</label>
          <input type="text" id="new-metric-name" placeholder="e.g., HbA1c, Fasting Glucose, ApoB" class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Target / Desirable Threshold</label>
          <input type="text" id="new-metric-target" placeholder="e.g., < 5.7 %, < 100 mg/dL" class="w-full border border-slate-300 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Conversion Type</label>
          <select id="new-metric-conv" class="w-full border border-slate-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="none">No conversion / static unit</option>
            <option value="cholesterol">Cholesterol standard (mg/dL ÷ 38.67 = mmol/L)</option>
            <option value="triglycerides">Triglycerides standard (mg/dL ÷ 88.57 = mmol/L)</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeMetricModal()" class="px-3 py-1.5 text-xs text-slate-600 font-medium hover:bg-slate-100 rounded">Cancel</button>
        <button onclick="saveNewMetric()" class="px-4 py-1.5 text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded shadow-sm">Save Parameter</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Initial Dataset extracted from your Excel file
    // -------------------------------------------------------------
    const DEFAULT_DATA = {
      years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026],
      metrics: [
        { id: "tc", name: "Total Cholesterol", target: "< 200 mg/dL", conv: "cholesterol" },
        { id: "hdl", name: "HDL", target: "> 40 mg/dL", conv: "cholesterol" },
        { id: "ldl", name: "LDL", target: "< 130 mg/dL", conv: "cholesterol" },
        { id: "tg", name: "Triglycerides (Fat)", target: "< 150 mg/dL", conv: "triglycerides" }
      ],
      users: {
        "CM": {
          "tc":  { 2017: 240.5, 2018: 225.0, 2019: 224.3, 2023: 212.3, 2024: 225.4, 2025: 217.3 },
          "hdl": { 2017: 43.7, 2018: 44.0, 2019: 42.5, 2023: 38.7, 2024: 41.4, 2025: 35.6 },
          "ldl": { 2017: 168.6, 2018: 153.0, 2019: 143.1, 2023: 150.0, 2024: 148.9, 2025: 152.7 },
          "tg":  { 2017: 141.7, 2018: 140.0, 2019: 194.9, 2023: 118.7, 2024: 230.3, 2025: 146.1 }
        },
        "ZH": {
          "tc":  { 2017: 265, 2019: 250, 2020: 265, 2021: 272, 2023: 260, 2024: 261, 2025: 253, 2026: 317 },
          "hdl": { 2017: 66, 2019: 57, 2020: 55, 2021: 46, 2023: 64, 2024: 51, 2025: 56, 2026: 53 },
          "ldl": { 2017: 175, 2019: 165, 2020: 174, 2021: 178, 2023: 165, 2024: 167, 2025: 170, 2026: 229 },
          "tg":  { 2017: 119, 2019: 138, 2020: 181, 2021: 241, 2023: 155, 2024: 216, 2025: 135, 2026: 175 }
        },
        "SS": {
          "tc":  { 2017: 206, 2018: 237, 2019: 274, 2020: 245, 2021: 226, 2022: 225, 2023: 189, 2024: 224, 2025: 247 },
          "hdl": { 2017: 46, 2018: 70, 2019: 71, 2020: 65, 2021: 67, 2022: 60, 2023: 58, 2024: 59, 2025: 50 },
          "ldl": { 2017: 138, 2018: 157, 2019: 189, 2020: 158, 2021: 149, 2022: 143, 2023: 123, 2024: 137, 2025: 170 },
          "tg":  { 2017: 108, 2018: 48, 2019: 68, 2020: 111, 2021: 48, 2022: 107, 2023: 54, 2024: 138, 2025: 142 }
        },
        "KF": {
          "tc":  { 2024: 261, 2025: 210.4 },
          "hdl": { 2024: 37, 2025: 48.7 },
          "ldl": { 2024: 170, 2025: 130.3 },
          "tg":  { 2024: 559, 2025: 157.7 }
        }
      }
    };

    // State
    let appState = JSON.parse(localStorage.getItem("cholesterol_tracker_data")) || DEFAULT_DATA;
    let currentUnit = "mgdl"; // 'mgdl' | 'mmol'
    let activeUser = "CM";
    let chartInstance = null;

    const USER_COLORS = {
      "CM": "#3b82f6", // Blue
      "ZH": "#10b981", // Emerald
      "SS": "#f59e0b", // Amber
      "KF": "#ec4899"  // Pink
    };

    function saveData() {
      localStorage.setItem("cholesterol_tracker_data", JSON.stringify(appState));
    }

    // Conversion helper functions
    function toDisplayValue(valMgDl, convType) {
      if (valMgDl === null || valMgDl === undefined || isNaN(valMgDl)) return "";
      if (currentUnit === "mgdl" || convType === "none") {
        return Math.round(valMgDl * 10) / 10;
      }
      if (convType === "cholesterol") {
        return (valMgDl / 38.67).toFixed(2);
      }
      if (convType === "triglycerides") {
        return (valMgDl / 88.57).toFixed(2);
      }
      return valMgDl;
    }

    function fromDisplayValue(inputVal, convType) {
      if (inputVal === "" || isNaN(inputVal)) return null;
      let num = parseFloat(inputVal);
      if (currentUnit === "mgdl" || convType === "none") return num;
      if (convType === "cholesterol") return num * 38.67;
      if (convType === "triglycerides") return num * 88.57;
      return num;
    }

    function setUnit(unit) {
      currentUnit = unit;
      document.getElementById("btn-mgdl").className = unit === 'mgdl' 
        ? "px-3 py-1 rounded bg-white shadow text-slate-800" 
        : "px-3 py-1 rounded text-slate-500 hover:text-slate-900";
      document.getElementById("btn-mmol").className = unit === 'mmol' 
        ? "px-3 py-1 rounded bg-white shadow text-slate-800" 
        : "px-3 py-1 rounded text-slate-500 hover:text-slate-900";
      
      renderTable();
      renderChart();
    }

    // Render User Selector Tabs
    function renderTabs() {
      const container = document.getElementById("user-tab-buttons");
      container.innerHTML = "";
      Object.keys(appState.users).forEach(u => {
        const btn = document.createElement("button");
        const isActive = u === activeUser;
        btn.textContent = `User ${u}`;
        btn.className = `px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${
          isActive 
            ? "bg-slate-900 text-white shadow-sm" 
            : "bg-white text-slate-600 hover:bg-slate-100 border border-slate-200"
        }`;
        btn.onclick = () => { activeUser = u; renderTabs(); renderTable(); };
        container.appendChild(btn);
      });
    }

    // Render Data Table for Active User
    function renderTable() {
      const thead = document.getElementById("table-head-row");
      const tbody = document.getElementById("table-body");

      // Build Headers
      thead.innerHTML = `
        <th class="py-3 px-4 font-semibold">Parameter</th>
        <th class="py-3 px-3 font-semibold">Desirable Level</th>
        ${appState.years.map(y => `<th class="py-3 px-2 text-center font-semibold">${y}</th>`).join("")}
      `;

      // Build Metric Rows
      tbody.innerHTML = "";
      const userData = appState.users[activeUser] || {};

      appState.metrics.forEach(m => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition-colors";

        let cellsHtml = `
          <td class="py-3 px-4 font-sans font-medium text-slate-800">${m.name}</td>
          <td class="py-3 px-3 font-sans text-slate-500 text-[11px]">${m.target || '-'}</td>
        `;

        appState.years.forEach(year => {
          const rawVal = (userData[m.id] && userData[m.id][year] !== undefined) ? userData[m.id][year] : "";
          const displayVal = toDisplayValue(rawVal, m.conv);

          cellsHtml += `
            <td class="py-2 px-1 text-center">
              <input 
                type="number" 
                step="any"
                value="${displayVal}"
                placeholder="-"
                onchange="updateCellValue('${m.id}', ${year}, this.value, '${m.conv}')"
                class="w-16 text-center py-1 bg-transparent hover:bg-slate-100 focus:bg-white focus:ring-1 focus:ring-indigo-500 rounded border border-transparent hover:border-slate-300 focus:border-indigo-400 font-mono text-xs"
              />
            </td>
          `;
        });

        tr.innerHTML = cellsHtml;
        tbody.appendChild(tr);
      });
    }

    function updateCellValue(metricId, year, valStr, convType) {
      if (!appState.users[activeUser][metricId]) {
        appState.users[activeUser][metricId] = {};
      }
      const storedVal = fromDisplayValue(valStr, convType);
      if (storedVal === null) {
        delete appState.users[activeUser][metricId][year];
      } else {
        appState.users[activeUser][metricId][year] = Math.round(storedVal * 100) / 100;
      }
      saveData();
      renderChart();
    }

    // Chart.js Cross-User Trend Comparison
    function populateChartSelect() {
      const select = document.getElementById("chart-metric-select");
      select.innerHTML = "";
      appState.metrics.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.name;
        select.appendChild(opt);
      });
    }

    function renderChart() {
      const metricId = document.getElementById("chart-metric-select").value || appState.metrics[0].id;
      const metricMeta = appState.metrics.find(m => m.id === metricId) || appState.metrics[0];

      const datasets = Object.keys(appState.users).map(u => {
        const uData = appState.users[u][metricId] || {};
        const points = appState.years.map(y => {
          const val = uData[y];
          return val !== undefined ? parseFloat(toDisplayValue(val, metricMeta.conv)) : null;
        });

        return {
          label: `User ${u}`,
          data: points,
          borderColor: USER_COLORS[u] || "#64748b",
          backgroundColor: USER_COLORS[u] || "#64748b",
          tension: 0.25,
          spanGaps: true,
          pointRadius: 4,
          pointHoverRadius: 6
        };
      });

      const ctx = document.getElementById("trendChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: appState.years,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
            tooltip: {
              callbacks: {
                label: (ctx) => ` ${ctx.dataset.label}: ${ctx.raw} ${currentUnit === 'mgdl' ? 'mg/dL' : 'mmol/L'}`
              }
            }
          },
          scales: {
            y: {
              title: {
                display: true,
                text: `${metricMeta.name} (${currentUnit === 'mgdl' ? 'mg/dL' : 'mmol/L'})`,
                font: { size: 11 }
              },
              grid: { color: "#f1f5f9" }
            },
            x: { grid: { display: false } }
          }
        }
      });
    }

    // Year and Metric Handlers
    function addNewYearPrompt() {
      const lastYear = appState.years[appState.years.length - 1];
      const nextYear = prompt("Enter new year:", lastYear + 1);
      if (nextYear && !isNaN(nextYear)) {
        const yr = parseInt(nextYear);
        if (!appState.years.includes(yr)) {
          appState.years.push(yr);
          appState.years.sort((a,b) => a - b);
          saveData();
          renderTable();
          renderChart();
        }
      }
    }

    function openMetricModal() {
      document.getElementById("metric-modal").classList.remove("hidden");
    }

    function closeMetricModal() {
      document.getElementById("metric-modal").classList.add("hidden");
      document.getElementById("new-metric-name").value = "";
      document.getElementById("new-metric-target").value = "";
    }

    function saveNewMetric() {
      const name = document.getElementById("new-metric-name").value.trim();
      const target = document.getElementById("new-metric-target").value.trim();
      const conv = document.getElementById("new-metric-conv").value;

      if (!name) return alert("Please enter a parameter name.");

      const id = "custom_" + Date.now();
      appState.metrics.push({ id, name, target, conv });
      saveData();
      closeMetricModal();
      populateChartSelect();
      renderTable();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `health_tracker_data_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    // App Initialization
    window.onload = () => {
      renderTabs();
      populateChartSelect();
      renderTable();
      renderChart();
    };
  </script>
</body>
</html>
